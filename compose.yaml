# Hela Utpost lokalt med ett kommando:  docker compose up --build
# Bara databaserna (och appen med npm run dev på din dator):  docker compose up -d postgres mongo
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: utpost
      POSTGRES_PASSWORD: utpost
      POSTGRES_DB: utpost
    ports:
      - "5433:5432" # på värden: 5433, så att npm run dev:api utanför Docker fortfarande fungerar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck: # api väntar tills det här säger ok – annars startar API:et innan databasen svarar
      test: ["CMD-SHELL", "pg_isready -U utpost -d utpost"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8.2 # låst till 8.2: taggarna 8, 8.0 och latest vägrar starta på ny Docker Desktop (Linux-kärna 6.19+, SERVER-121912)
    environment:
      MONGO_INITDB_ROOT_USERNAME: utpost
      MONGO_INITDB_ROOT_PASSWORD: utpost
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: utpost-api # M8: fast namn, så att jobbet Säkerhet kan skanna imagen (annars <mapp>-api)
    build:
      context: . # repots rot, inte api/ – Dockerfilen kopierar shared/ också
      dockerfile: api/Dockerfile
    environment:
      # Inne i compose-nätverket heter databaserna som tjänsterna: postgres och mongo, inte localhost.
      # Portarna är containrarnas egna (5432), inte de publicerade (5433).
      DATABASE_URL: postgres://utpost:utpost@postgres:5432/utpost
      MONGO_URL: mongodb://utpost:utpost@mongo:27017/utpost?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-} # M8 (H4): från .env (gitignorerad, se .env.example) – inget värde i repot. Saknas den startar inte api
      SEED_ON_START: '1' # M6: tom databas vid start → seed + migrate:logs. Lokalt: harmlöst, seedar bara om users är tom
      # M7: bildfunktionen kör inte i compose – den kör på din dator med func start (npm run dev:functions).
      # host.docker.internal är värddatorn sedd inifrån en container (Docker Desktop på Mac och Windows).
      IMAGE_FUNCTION_URL: http://host.docker.internal:7071/api/process-image
      # M9: CMS:et. Värdena kommer från .env (gitignorerad) – tomma betyder att CMS:et är avstängt och appen kör utan notiser
      CONTENTFUL_SPACE_ID: ${CONTENTFUL_SPACE_ID:-}
      CONTENTFUL_DELIVERY_TOKEN: ${CONTENTFUL_DELIVERY_TOKEN:-}
      CONTENTFUL_PREVIEW_TOKEN: ${CONTENTFUL_PREVIEW_TOKEN:-}
      CMS_WEBHOOK_SECRET: ${CMS_WEBHOOK_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway" # M7: samma namn på Linux (Docker Engine), där det inte finns av sig självt
    # Inga ports: browsern når API:et genom nginx i client (/api och /graphql skickas vidare
    # till api:4000 inne i nätverket). Felsöka API:et direkt? Lägg tillbaka  ports: - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  client:
    image: utpost-client
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      API_UPSTREAM: api:4000 # M6: vart nginx skickar /api och /graphql. I Azure (sidecars i samma app): localhost:4000
    ports:
      - "3001:80" # nginx lyssnar på 80 i containern
    depends_on:
      - api

volumes:
  pgdata:
  mongodata:
